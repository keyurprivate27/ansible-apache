<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ansible Test Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f4f7fb, #e8f0ff);
      color: #1f2937;
    }
    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    h1 {
      color: #2563eb;
      margin-bottom: 10px;
    }
    p {
      line-height: 1.7;
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 14px;
      background: #dcfce7;
      color: #166534;
      border-radius: 999px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to the Ansible Test Page</h1>
    <p>This page was prepared to test a simple web deployment with Ansible.</p>
    <p>It includes a modern layout, clear content, and a friendly design so it is easy to verify that the deployment worked correctly.</p>
    <div class="badge">Deployment Ready</div>
  </div>
</body>
</html>
